services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./models:/app/models
      - ./data:/app/data
    working_dir: /app
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6g

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    working_dir: /app
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g