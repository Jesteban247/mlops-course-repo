apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-3-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jesteban247/mlops-course-repo.git
    targetRevision: main
    path: project_3/k8s/api
  destination:
    server: https://kubernetes.default.svc
    namespace: project-3
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: property-api
    jsonPointers:
    - /spec/replicas
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
