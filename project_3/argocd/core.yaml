apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-3-core
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jesteban247/mlops-course-repo.git
    targetRevision: main
    path: project_3/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: project-3
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
