apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: project-3}
spec:
  replicas: 1
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      nodeSelector: {kubernetes.io/hostname: nbam07}
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.17.2-full
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              exec mlflow server --host 0.0.0.0 --port 5000 --workers 1
              --backend-store-uri "$MLFLOW_BACKEND_URI"
              --artifacts-destination s3://mlflow-artifacts --serve-artifacts
              --allowed-hosts 'mlflow,mlflow:5000,mlflow.project-3.svc.cluster.local,mlflow.project-3.svc.cluster.local:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000'
          envFrom:
            - secretRef: {name: project-3-settings}
          env:
            - {name: MLFLOW_S3_ENDPOINT_URL, value: 'http://minio:9000'}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
          ports: [{name: http, containerPort: 5000}]
          resources:
            requests: {cpu: 150m, memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - {name: Host, value: 'mlflow:5000'}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: project-3}
spec:
  selector: {app: mlflow}
  ports: [{name: http, port: 5000, targetPort: http}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-mlflow-bucket
  namespace: project-3
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector: {kubernetes.io/hostname: nbam19}
      containers:
        - name: create-bucket
          image: amazon/aws-cli:2.33.25
          command: ['/bin/sh', '-ec']
          args:
            - 'until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do sleep 5; done; aws --endpoint-url http://minio:9000 s3api head-bucket --bucket mlflow-artifacts 2>/dev/null || aws --endpoint-url http://minio:9000 s3api create-bucket --bucket mlflow-artifacts'
          envFrom:
            - secretRef: {name: project-3-settings}
          env:
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
