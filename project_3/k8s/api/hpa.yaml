apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: property-api, namespace: project-3}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: property-api}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
