apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: project-3
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: jupyter}
  template:
    metadata:
      labels: {app: jupyter}
    spec:
      nodeSelector: {kubernetes.io/hostname: nbam19}
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: jupyter
          image: quay.io/jupyter/scipy-notebook:python-3.12
          workingDir: /tmp/project-3-work
          envFrom:
            - secretRef: {name: project-3-settings}
          env:
            - {name: HOME, value: /tmp}
            - {name: PYTHONPATH, value: '/tmp/project-3-deps:/tmp/project-3-work/src'}
            - {name: APP_DB_HOST, value: property-postgres}
          command: ["/bin/bash", "-ec"]
          args:
            - >-
              python -m pip install --no-cache-dir --target /tmp/project-3-deps -r /tmp/project-3-work/notebooks/requirements.txt &&
              exec jupyter lab --ServerApp.ip=0.0.0.0 --ServerApp.port=8888
              --ServerApp.open_browser=False --ServerApp.root_dir=/tmp/project-3-work
              --IdentityProvider.token="$JUPYTER_TOKEN"
          ports:
            - {name: http, containerPort: 8888}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 150m, memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: project, mountPath: /tmp/project-3-work}
      volumes:
        - name: project
          nfs:
            server: 10.43.97.96
            path: /home/estudiante/mlops-course-repo/project_3
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: project-3
spec:
  selector: {app: jupyter}
  ports:
    - {name: http, port: 8888, targetPort: http}
