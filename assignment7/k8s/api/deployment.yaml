apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment7-api
  labels:
    app: assignment7-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assignment7-api
  template:
    metadata:
      labels:
        app: assignment7-api
    spec:
      containers:
        - name: api
          image: jesteban247/assignment7-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: assignment7-api
spec:
  selector:
    app: assignment7-api
  sessionAffinity: None
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 32302
  type: NodePort
