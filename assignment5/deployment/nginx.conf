worker_processes auto;
events { worker_connections 4096; }
http {
    log_format upstream '$remote_addr "$request" status=$status backend=$upstream_addr '
                        'backend_status=$upstream_status total=$request_time upstream=$upstream_response_time';
    access_log /dev/stdout upstream;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream inference {
        zone inference 64k;
        server api:8000 resolve;
    }
    server {
        listen 8000;
        location / {
            proxy_pass http://inference;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_next_upstream off;
        }
    }
}
