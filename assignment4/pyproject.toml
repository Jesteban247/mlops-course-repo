[project]
name = "assignment4-heart-disease"
version = "0.1.0"
description = "Reproducible environments for Assignment 4 notebooks and services"
requires-python = "==3.11.*"
dependencies = [
    "boto3==1.37.18",
    "mlflow==3.5.0",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
notebooks = [
    "ipykernel==6.30.1",
    "jupyterlab==4.4.10",
    "matplotlib==3.10.6",
    "psycopg2-binary==2.9.10",
    "ucimlrepo==0.0.7",
]
mlflow-server = [
    "psycopg2-binary==2.9.10",
]
api = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
]

[tool.uv]
package = false
