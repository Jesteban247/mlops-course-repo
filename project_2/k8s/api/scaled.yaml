apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-api-scaled
  namespace: mlops-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diabetes-api-scaled
  template:
    metadata:
      labels:
        app: diabetes-api-scaled
    spec:
      nodeSelector:
        kubernetes.io/hostname: nbam19
      containers:
      - name: api
        image: jesteban247/diabetes-api:20261102-v3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: API_NAME
          valueFrom: {configMapKeyRef: {name: project-settings, key: SCALED_API_NAME}}
        - name: MLFLOW_TRACKING_URI
          valueFrom: {configMapKeyRef: {name: project-settings, key: MLFLOW_TRACKING_URI}}
        - name: MLFLOW_S3_ENDPOINT_URL
          valueFrom: {configMapKeyRef: {name: project-settings, key: MINIO_ENDPOINT_URL}}
        - name: AWS_DEFAULT_REGION
          valueFrom: {configMapKeyRef: {name: project-settings, key: AWS_DEFAULT_REGION}}
        - name: DIABETES_DB_HOST
          valueFrom: {configMapKeyRef: {name: project-settings, key: DIABETES_DB_HOST}}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: stack-secrets
              key: MINIO_ROOT_USER
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: stack-secrets
              key: MINIO_ROOT_PASSWORD
        - name: DIABETES_DB_USER
          valueFrom:
            secretKeyRef:
              name: stack-secrets
              key: DIABETES_DB_USER
        - name: DIABETES_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stack-secrets
              key: DIABETES_DB_PASSWORD
        - name: DIABETES_DB_NAME
          valueFrom:
            secretKeyRef:
              name: stack-secrets
              key: DIABETES_DB_NAME
        - name: MODEL_REFRESH_SECONDS
          valueFrom: {configMapKeyRef: {name: project-settings, key: MODEL_REFRESH_SECONDS}}
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: diabetes-api-scaled
  namespace: mlops-project
spec:
  selector:
    app: diabetes-api-scaled
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: diabetes-api-scaled
  namespace: mlops-project
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: diabetes-api-scaled
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
