apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-reader
  namespace: mlops-project
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-reader
  namespace: mlops-project
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-reader
  namespace: mlops-project
subjects:
- kind: ServiceAccount
  name: prometheus-reader
  namespace: mlops-project
roleRef:
  kind: Role
  name: prometheus-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mlops-project
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
    - job_name: diabetes-api-scaled
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - mlops-project
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_namespace
        action: keep
        regex: mlops-project
      - source_labels:
        - __meta_kubernetes_pod_label_app
        action: keep
        regex: diabetes-api-scaled
      - source_labels:
        - __meta_kubernetes_pod_container_port_name
        action: keep
        regex: http
      - source_labels:
        - __meta_kubernetes_pod_ready
        action: keep
        regex: 'true'
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: mlops-project
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Project Prometheus
      uid: project-prometheus
      type: prometheus
      access: proxy
      url: http://prometheus.mlops-project.svc.cluster.local:9090
      isDefault: true
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
    - name: Project
      orgId: 1
      folder: MLOps
      type: file
      disableDeletion: true
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: mlops-project
data:
  diabetes-api.json: |-
    {
      "uid": "diabetes-api",
      "title": "Diabetes API",
      "schemaVersion": 39,
      "version": 4,
      "refresh": "15s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 7,
          "type": "stat",
          "title": "Ready API pods",
          "description": "Ready API pods successfully scraped by Prometheus.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "count(up{job=\"diabetes-api-scaled\"} == 1) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Prediction requests in selected time",
          "description": "Approximate requests observed during the selected time, including failures. A request can contain multiple records.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(diabetes_predictions_total{job=\"diabetes-api-scaled\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Successful requests in selected time",
          "description": "Approximate successful HTTP prediction requests observed during the selected time.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(diabetes_predictions_total{job=\"diabetes-api-scaled\",status=~\"2..\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Failed requests in selected time",
          "description": "Approximate non-2xx prediction requests observed during the selected time.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(diabetes_predictions_total{job=\"diabetes-api-scaled\",status!~\"2..\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "Prediction requests per second",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(diabetes_predictions_total[2m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Prediction errors per second",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(diabetes_predictions_total{status!~\"2..\"}[2m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Prediction latency p95",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(diabetes_prediction_seconds_bucket[5m])))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Ready API targets",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "count(up{job=\"diabetes-api-scaled\"} == 1)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "API CPU by pod",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total{job=\"diabetes-api-scaled\"}[2m])",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "API memory by pod",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "process_resident_memory_bytes{job=\"diabetes-api-scaled\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "bargauge",
          "title": "Prediction requests per second by pod",
          "description": "Average request rate over the last 2 minutes. Zero means no prediction requests observed for that ready pod.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 29
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(diabetes_predictions_total{job=\"diabetes-api-scaled\"}[2m])) or (sum by (pod) (up{job=\"diabetes-api-scaled\"}) * 0)",
              "refId": "A",
              "instant": true,
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Average prediction latency",
          "description": "Average API processing time over two minutes.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 37
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(diabetes_prediction_seconds_sum{job=\"diabetes-api-scaled\"}[2m])) / sum(rate(diabetes_prediction_seconds_count{job=\"diabetes-api-scaled\"}[2m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Prediction error percentage",
          "description": "Non-2xx prediction responses as a fraction of all prediction requests over two minutes.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 37
          },
          "datasource": {
            "type": "prometheus",
            "uid": "project-prometheus"
          },
          "targets": [
            {
              "expr": "(sum(rate(diabetes_predictions_total{job=\"diabetes-api-scaled\",status!~\"2..\"}[2m])) or vector(0)) / sum(rate(diabetes_predictions_total{job=\"diabetes-api-scaled\"}[2m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          }
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: mlops-project
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: mlops-project
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mlops-project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      nodeSelector:
        kubernetes.io/hostname: nbam19
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      serviceAccountName: prometheus-reader
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        - --storage.tsdb.retention.size=1500MB
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mlops-project
spec:
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mlops-project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        kubernetes.io/hostname: nbam19
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:12.1.0
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: stack-secrets
              key: GRAFANA_USERNAME
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stack-secrets
              key: GRAFANA_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: provisioning
          mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
          subPath: datasource.yaml
        - name: provisioning
          mountPath: /etc/grafana/provisioning/dashboards/dashboard-provider.yaml
          subPath: dashboard-provider.yaml
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: provisioning
        configMap:
          name: grafana-provisioning
      - name: dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: mlops-project
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
