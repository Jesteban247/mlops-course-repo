apiVersion: apps/v1
kind: Deployment
metadata: {name: diabetes-ui, namespace: mlops-project}
spec:
  replicas: 1
  selector:
    matchLabels: {app: diabetes-ui}
  template:
    metadata:
      labels: {app: diabetes-ui}
    spec:
      nodeSelector: {kubernetes.io/hostname: nbam19}
      containers:
        - name: streamlit
          image: jesteban247/diabetes-ui:20261102-v1
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8501}]
          env:
            - name: API_URL
              valueFrom: {configMapKeyRef: {name: project-settings, key: SCALED_API_URL}}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata: {name: diabetes-ui, namespace: mlops-project}
spec:
  selector: {app: diabetes-ui}
  ports: [{name: http, port: 8501, targetPort: http}]
