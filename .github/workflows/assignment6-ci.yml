name: Assignment 6 CI and Docker Hub

on:
  pull_request:
    branches: [main]
    paths:
      - "assignment6/**"
      - ".github/workflows/assignment6-ci.yml"
  push:
    branches: [main]
    paths:
      - "assignment6/**"
      - ".github/workflows/assignment6-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignment6
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: assignment6/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests and report coverage
        run: python -m pytest -v --cov=app --cov-report=term-missing

  publish-pr-image:
    name: Build and publish PR image
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push PR image
        uses: docker/build-push-action@v7
        with:
          context: ./assignment6
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ml-preprocessing-api:pr-${{ github.event.number }}

      - name: Verify PR image
        run: docker pull "${{ secrets.DOCKERHUB_USERNAME }}/ml-preprocessing-api:pr-${{ github.event.number }}"

  publish-main-image:
    name: Publish main image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./assignment6
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ml-preprocessing-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ml-preprocessing-api:sha-${{ github.sha }}

      - name: Verify published image
        run: docker pull "${{ secrets.DOCKERHUB_USERNAME }}/ml-preprocessing-api:sha-${{ github.sha }}"
