name: Project 3 CI and API image
on:
  pull_request:
    branches: [main]
    paths: ['project_3/**', '.github/workflows/project-3-ci.yml']
  push:
    branches: [main]
    paths: ['project_3/api/**', 'project_3/src/**', 'project_3/tests/**', '.github/workflows/project-3-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project_3/api/requirements.txt
      - run: pip install -r project_3/api/requirements.txt pytest httpx
      - run: PYTHONPATH=project_3/src:project_3 pytest -q project_3/tests
  publish:
    permissions:
      contents: write
    concurrency:
      group: project-3-api-publish
      cancel-in-progress: false
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./project_3
          file: ./project_3/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/project-3-property-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/project-3-property-api:sha-${{ github.sha }}
      - name: Update API image in main
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/project-3-property-api
          IMAGE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git diff --quiet "$IMAGE_COMMIT" origin/main -- project_3/api project_3/src project_3/tests .github/workflows/project-3-ci.yml; then
            echo "A newer API change exists on main; its workflow will update the manifest."
            exit 0
          fi
          git switch -C main origin/main
          python - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          manifest = Path('project_3/k8s/api/api.yaml')
          content = manifest.read_text()
          image = f"docker.io/{os.environ['IMAGE_REPOSITORY']}:sha-{os.environ['IMAGE_COMMIT']}"
          updated, count = re.subn(r'(?m)^([ \t]*image:[ \t]*)\S+[ \t]*$', lambda m: m.group(1) + image, content)
          if count != 1:
              raise SystemExit(f'Expected one API image, found {count}')
          manifest.write_text(updated)
          PYTHON
          if git diff --quiet -- project_3/k8s/api/api.yaml; then
            echo "Manifest already references the published image."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_3/k8s/api/api.yaml
          git commit -m "Update Project 3 API image to ${IMAGE_COMMIT}"
          git push origin HEAD:main
