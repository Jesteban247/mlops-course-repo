name: Project 3 CI and API image

on:
  pull_request:
    branches: [main]
    paths: ['project_3/**', '.github/workflows/project-3-ci.yml']

permissions:
  contents: read

concurrency:
  group: project-3-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project_3/api/requirements.txt
      - run: pip install -r project_3/api/requirements.txt pytest httpx
      - run: PYTHONPATH=project_3/src:project_3 pytest -q project_3/tests

  publish:
    needs: test
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    steps:
      - name: Check PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect image input changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "$BASE_SHA" HEAD)"
          baseline="$base"
          image="$(awk '$1 == "image:" {print $2}' project_3/k8s/api/api.yaml)"
          if [[ "$image" =~ /project-3-property-api:sha-([0-9a-f]{40})$ ]]; then
            built_commit="${BASH_REMATCH[1]}"
            if git merge-base --is-ancestor "$built_commit" HEAD &&
               ! git merge-base --is-ancestor "$built_commit" "$base"; then
              baseline="$built_commit"
            fi
          fi

          if git diff --quiet "$baseline" HEAD -- \
            project_3/.dockerignore .github/workflows/project-3-ci.yml \
            project_3/api project_3/src/property_ml \
            ':(exclude,glob)project_3/api/**/*.md' \
            ':(exclude,glob)project_3/src/property_ml/**/*.md'; then
            echo 'api=false' >> "$GITHUB_OUTPUT"
          else
            echo 'api=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to Docker Hub
        if: steps.changes.outputs.api == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish API image
        if: steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./project_3
          file: ./project_3/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/project-3-property-api:sha-${{ github.event.pull_request.head.sha }}
      - name: Create GitHub App token
        if: steps.changes.outputs.api == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PROJECT3_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT3_APP_PRIVATE_KEY }}
      - name: Check out PR branch for update
        if: steps.changes.outputs.api == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Commit API image tag to PR branch
        if: steps.changes.outputs.api == 'true'
        env:
          IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_COMMIT: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$IMAGE_COMMIT" ]; then
            echo 'The PR branch changed while the image was building; the newer run will handle it.'
            exit 1
          fi
          python - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          manifest = Path('project_3/k8s/api/api.yaml')
          image = f"docker.io/{os.environ['IMAGE_OWNER']}/project-3-property-api:sha-{os.environ['IMAGE_COMMIT']}"
          updated, count = re.subn(r'(?m)^([ \t]*image:[ \t]*)\S+[ \t]*$', lambda m: m.group(1) + image, manifest.read_text())
          if count != 1:
              raise SystemExit(f'Expected one image in {manifest}, found {count}')
          manifest.write_text(updated)
          PYTHON
          if git diff --quiet -- project_3/k8s/api/api.yaml; then
            echo 'Manifest already references this image.'
            exit 0
          fi
          git config user.name 'project-3-image-bot'
          git config user.email 'project-3-image-bot@users.noreply.github.com'
          git add project_3/k8s/api/api.yaml
          git commit -m 'Update Project 3 API image tag'
          git push origin "HEAD:refs/heads/$BRANCH"
